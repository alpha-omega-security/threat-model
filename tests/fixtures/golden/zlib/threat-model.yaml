host_side_effects:
  - {effect: network-sockets, stance: absent, components: [core-inflate, core-deflate, gzip-file-api], conditions: "all supported library entry points", provenance: {kind: inferred, question_id: Q5}}
  - {effect: child-processes, stance: absent, components: [core-inflate, core-deflate, gzip-file-api], conditions: "all supported library entry points", provenance: {kind: inferred, question_id: Q5}}
  - {effect: signal-handlers, stance: absent, components: [core-inflate, core-deflate, gzip-file-api], conditions: "all supported library entry points", provenance: {kind: inferred, question_id: Q5}}
  - {effect: environment-reads, stance: absent, components: [core-inflate, core-deflate, gzip-file-api], conditions: "all supported library entry points", provenance: {kind: inferred, question_id: Q5}}
