outputs:
  - component: core-inflate
    channel: inflate-output-buffer
    taint: same-as-input
    taint_provenance: {kind: documented, source: "inflate API contract"}
    invariants:
      - id: output-bound-honored
        statement: "writes bounded by caller-supplied avail_out"
        property_id: output-bound-honored
        provenance: {kind: documented, source: "inflate API contract"}
    downstream_must_not_assume:
      - id: output-is-grammar-safe
        statement: "output is safe for a higher-layer grammar"
        provenance: {kind: inferred, question_id: Q3}

adversaries:
  - name: compressed-input-author
    scope: in
    capabilities: [supply-input-bytes, choose-input-size]
    excluded_capabilities: [control-host-process]
    goals: [memory-corruption, resource-exhaustion]
    provenance: {kind: documented, source: "zlib manual"}
  - name: in-process-caller
    scope: out
    capabilities: [control-host-process]
    excluded_capabilities: []
    goals: []
    provenance: {kind: inferred, question_id: Q1}

dependency_policy:
  zero_runtime_dependencies: false
  provenance: {kind: documented, source: "zlib build manifest"}

dependencies:
  - name: caller-supplied-allocator
    relied_on_for: "standard zalloc/zfree allocator contract"
    relied_on_properties: [allocator-size-correctness]
    caller_obligations_acknowledged: []
    adversary_capabilities_forwarded: []
    outputs_consumed: []
    covered_here: false
    violation_disposition: "OUT-OF-MODEL: dependency-contract"
    provenance: {kind: documented, source: "allocator API contract"}
  - name: platform-libc
    relied_on_for: "host libc malloc/free and standard runtime facilities"
    relied_on_properties: [allocator-size-correctness]
    caller_obligations_acknowledged: []
    adversary_capabilities_forwarded: []
    outputs_consumed: []
    covered_here: false
    violation_disposition: "OUT-OF-MODEL: dependency-contract"
    provenance: {kind: documented, source: "zlib manual"}

build_policy:
  security_relevant_flags_present: true
  provenance: {kind: documented, source: "zlib build documentation"}

build_flags:
  - name: ZLIB_CONST
    default: "off"
    security_relevant: false
    maintainer_stance: supported
    affects_properties: []
    provenance: {kind: documented, source: "zlib build documentation"}
  - name: custom-MAX_WBITS
    default: "shipped default"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - {property_id: configured-window-memory-bound, effect: narrows}
    provenance: {kind: documented, source: "zlib build documentation"}

properties_claimed:
  - {id: memory-safety-untrusted-input, kind: memory-safety, components: [core-inflate, core-deflate], tier: security-critical, conditions: "any input on a supported platform", violation_symptoms: [crash, oob-read, oob-write], provenance: {kind: documented, source: "zlib manual"}}
  - {id: integrity-check-on-decode, kind: integrity, components: [core-inflate], tier: security-critical, conditions: "caller has not called inflateValidate(strm, 0)", violation_symptoms: [wrong-output], provenance: {kind: documented, source: "zlib manual, inflate check-value description"}}
  - {id: output-bound-honored, kind: resource-bound, components: [core-inflate, gzip-file-api], tier: security-critical, conditions: "single call with valid output buffer", violation_symptoms: [buffer-overflow], provenance: {kind: documented, source: "inflate API contract"}}
  - {id: termination, kind: availability, components: [core-inflate], tier: security-critical, conditions: "valid or invalid input", violation_symptoms: [hang, infinite-loop], provenance: {kind: documented, source: "zlib manual"}}
  - {id: stream-lifecycle, kind: correctness, components: [core-inflate, core-deflate, gzip-file-api], tier: correctness-only, conditions: "documented init/end or open/close sequence", violation_symptoms: [invalid-state], provenance: {kind: documented, source: "zlib manual"}}
  - {id: independent-stream-thread-safety, kind: correctness, components: [core-inflate, core-deflate], tier: correctness-only, conditions: "streams are independent", violation_symptoms: [data-race], provenance: {kind: documented, source: "zlib FAQ"}}
  - {id: configured-window-memory-bound, kind: resource-bound, components: [core-inflate, core-deflate], tier: correctness-only, conditions: "internal window allocation is bounded by configured MAX_WBITS", violation_symptoms: [allocation-exceeds-configured-bound], provenance: {kind: documented, source: "zlib build documentation"}}

properties_disclaimed:
  - {id: confidentiality-integrity-authenticity, components: [core-inflate, core-deflate, gzip-file-api], conditions: "all supported configurations", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "zlib manual"}}
  - {id: crc-as-mac, components: [gzip-file-api], conditions: "all supported configurations", tier: security-critical, false_friend: true, provenance: {kind: documented, source: "zlib manual"}}
  - {id: decompression-bomb-resistance, components: [core-inflate, gzip-file-api], conditions: "no caller output budget", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "zlib manual"}}
  - {id: failure-state-atomicity, components: [core-inflate, core-deflate, gzip-file-api], conditions: "operation returns failure", tier: correctness-only, false_friend: false, provenance: {kind: documented, source: "zlib manual"}}
  - {id: trusted-callback-safety, components: [core-inflate, core-deflate], conditions: "caller allocator violates its contract", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "zlib manual"}}
  - {id: resource-budgeting, components: [core-deflate], conditions: "caller-selected memory level", tier: correctness-only, false_friend: false, provenance: {kind: documented, source: "zlib manual"}}
  - {id: shared-stream-thread-safety, components: [gzip-file-api], conditions: "shared handle without synchronization", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "zlib FAQ"}}

downstream_responsibilities:
  - {id: cap-decompressed-output, component: core-inflate, statement: "cap total decompressed output", enforces: [decompression-bomb-resistance], provenance: {kind: documented, source: "zlib manual"}}
  - {id: sanitize-output, component: core-inflate, statement: "treat output as untrusted", enforces: [output-is-grammar-safe], provenance: {kind: documented, source: "zlib manual"}}
  - {id: serialize-shared-stream, component: gzip-file-api, statement: "synchronize shared stream access", enforces: [shared-stream-thread-safety], provenance: {kind: documented, source: "zlib FAQ"}}

known_misuses:
  - {id: crc-used-as-mac, components: [gzip-file-api], pattern: "using CRC-32 for authentication", safer_alternative: "use a MAC", provenance: {kind: documented, source: "zlib manual"}}
  - {id: unbounded-decompression, components: [core-inflate], pattern: "decompressing without an output cap", safer_alternative: "enforce an output budget", provenance: {kind: documented, source: "zlib manual"}}

known_non_findings:
  - {id: fuzzer-unbounded-memory, symptom: unbounded-allocation, components: [core-inflate], tool_pattern: "OOM on crafted stream without an output cap", conditions: "no output budget and no memory-safety violation", discharged_by: [decompression-bomb-resistance], provenance: {kind: documented, source: "zlib manual"}}
  - {id: crc-forgery, symptom: integrity-bypass, components: [gzip-file-api], tool_pattern: "CRC/Adler collision or forgery report", conditions: "report assumes checksum authenticity rather than memory corruption", discharged_by: [crc-as-mac], provenance: {kind: documented, source: "zlib manual"}}
  - {id: msan-uninitialized-value, symptom: uninitialized-read, components: [core-deflate], tool_pattern: "MSan/Valgrind use-of-uninitialized-value in the deflate match loop", conditions: "the value never affects deflate output and the read stays inside a zlib allocation", discharged_by: [memory-safety-untrusted-input], provenance: {kind: documented, source: "zlib FAQ"}}

dispositions:
