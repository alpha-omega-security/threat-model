entry_points:
  - id: inflate
    component: core-inflate
    parameters:
      - name: next_in/avail_in
        attacker_controllable: true
        control_kinds: [data, size]
        caller_must_enforce: "none — memory-safety-untrusted-input"
        provenance: {kind: documented, source: "inflate API contract"}
      - name: next_out/avail_out
        attacker_controllable: false
        control_kinds: [data, size]
        obligation_id: provide-valid-output-buffer
        caller_must_enforce: "buffer >= claimed size; honor avail_out"
        provenance: {kind: inferred, question_id: Q4}
  - id: inflateInit2
    component: core-inflate
    parameters:
      - name: windowBits
        attacker_controllable: false
        control_kinds: [size]
        obligation_id: valid-window-bits
        caller_must_enforce: "within documented range"
        provenance: {kind: inferred, question_id: Q4}
  - id: gzopen
    component: gzip-file-api
    parameters:
      - name: path
        attacker_controllable: false
        control_kinds: [resource-name]
        obligation_id: sanitize-gzip-path
        caller_must_enforce: "validate/sanitize path before passing"
        provenance: {kind: documented, source: "gzopen API contract"}

