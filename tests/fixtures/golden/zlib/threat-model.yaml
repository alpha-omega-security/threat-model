    provenance: {kind: documented, source: "zlib manual"}
  - name: gzip-file-api
    scope: in
    reachability_precondition: "reachable from gz* handle over caller-named file"
    provenance: {kind: documented, source: "zlib manual"}
  - name: contrib-samples
    scope: out
    reason: "third-party samples, unsupported per §1.3"
    provenance: {kind: inferred, question_id: Q2}
  - name: examples-demos
    scope: out
    reason: "examples/ demonstration programs, not the supported library surface per §1.3"
